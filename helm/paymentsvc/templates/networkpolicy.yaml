{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paymentsvc.fullname" . }}
  labels:
    {{- include "paymentsvc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paymentsvc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS, then the database. Nothing else leaves the pod.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- end }}
