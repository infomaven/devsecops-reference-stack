---
# Copy to vault.yml and encrypt:
#   ansible-vault encrypt ansible/group_vars/vault.yml
# The demo uses a vault password file that is gitignored; in CI the password
# comes from an environment secret and is never written to disk.
vault_postgres_superuser_password: bootstrap
vault_app_db_password: change-me-in-vault
vault_readonly_db_password: change-me-in-vault
