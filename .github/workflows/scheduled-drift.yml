---
name: drift-detection

# Nightly plan against every environment. A non-empty plan means something
# changed outside the pipeline, which is the question "is prod what we think
# it is" asked on a schedule instead of after an incident.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: plan with detailed exit code
        id: plan
        continue-on-error: true
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform -chdir=terraform/envs/${{ matrix.env }} init -input=false
          terraform -chdir=terraform/envs/${{ matrix.env }} plan -detailed-exitcode -input=false
      - name: open an issue when drift is found
        if: steps.plan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `drift detected in ${{ matrix.env }}`,
              body: 'Nightly plan was not empty. Someone changed this environment outside the pipeline.'
            });
