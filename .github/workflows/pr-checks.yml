---
name: pr-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: helm lint
        run: |
          for env in dev staging prod; do
            helm lint helm/paymentsvc -f "helm/paymentsvc/values-${env}.yaml"
          done
      - name: yamllint
        run: pipx run yamllint -s .
      - name: ansible-lint
        run: pipx run ansible-lint ansible

  # Secrets, SAST, dependency CVEs, and the SBOM live in security-scan.yml,
  # which is copied unmodified from security-engineer-toolkit. It pins every
  # action by commit SHA and every scanner binary by checksum. This job keeps
  # only the infrastructure-specific scanner, which that template does not run.
  iac-security:
    name: iac-security
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, matching the toolkit's standard. A tag can be
      # force-pushed; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checkov on terraform
        env:
          # Set to the release you verified, and bump it deliberately. The
          # action's own `@master` tag was removed for the reason the
          # toolkit's template header explains.
          CHECKOV_VERSION: "3.2.0"
        run: |
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov --directory terraform --framework terraform --compact

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: install conftest
        run: |
          curl -sSL -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest && sudo mv conftest /usr/local/bin/
      - name: rendered manifests must satisfy policy
        run: |
          for env in dev staging prod; do
            echo "::group::${env}"
            helm template paymentsvc helm/paymentsvc -f "helm/paymentsvc/values-${env}.yaml" \
              | conftest test --policy policy/kubernetes -
            echo "::endgroup::"
          done

  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: [lint, policy, iac-security]
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    environment: ${{ matrix.env }}-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform init
        run: terraform -chdir=terraform/envs/${{ matrix.env }} init -input=false
      - name: terraform validate
        run: terraform -chdir=terraform/envs/${{ matrix.env }} validate
      - name: terraform plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform -chdir=terraform/envs/${{ matrix.env }} plan \
            -input=false -no-color -out=tfplan | tee plan.txt
          terraform -chdir=terraform/envs/${{ matrix.env }} show -json tfplan > tfplan.json
      - name: policy check on the plan
        run: |
          curl -sSL -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest && sudo mv conftest /usr/local/bin/
          conftest test --policy policy/terraform terraform/envs/${{ matrix.env }}/tfplan.json
      - name: comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### plan: ${{ matrix.env }}\n\n<details><summary>show</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`
            });
